sentence=CMRInet (NMRA LCS-9.10.1) protocol suite: Host and Node engines over a shared codec and pluggable transports.
paragraph=Layout I/O image service with CMRInet as its first exchange strategy. Non-blocking PolledHost engine (poll schedule, timeouts, re-init ladder), PolledNode engine (emulator core and client), serial/RS-485 transport with strict framing, mock transports for desktop testing, and bench-instrument examples (OLED status, WiFi OTA, gateway).
