sentence=CMRInet (NMRA LCS-9.10.1) protocol: Host and Node engines over a shared codec and pluggable transports.
paragraph=CMRInet-compliant Hosts, Nodes, and Gateways. Non-blocking CMRIHost engine (poll schedule, timeouts, re-init ladder, conformance breaker), CMRINode engine (pack/unpack seam, I/T/P handling, R emission), serial/RS-485 transport with strict framing, mock transport for desktop testing, and bench-instrument examples (OLED status, WiFi OTA, tracer).
